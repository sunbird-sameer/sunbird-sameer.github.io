<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camera viewer</title>
<style>
  :root {
    --bg: #f3f5f2;
    --panel: #ffffff;
    --ink: #1b2420;
    --muted: #5d6b64;
    --line: #d5dcd7;
    --accent: #1f6f5c;
    --accent-ink: #ffffff;
    --stage: #0d1210;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101613; --panel: #18201c; --ink: #e6ede9; --muted: #93a39a;
      --line: #2a352f; --accent: #4fc3a1; --accent-ink: #08211a; --stage: #050807;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101613; --panel: #18201c; --ink: #e6ede9; --muted: #93a39a;
    --line: #2a352f; --accent: #4fc3a1; --accent-ink: #08211a; --stage: #050807;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    min-height: 100vh; display: flex; justify-content: center; padding: 20px 16px;
  }
  main { width: 100%; max-width: 760px; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; font-weight: 650; }
  p.sub { margin: 0 0 16px; color: var(--muted); font-size: .95rem; }
  .stage {
    position: relative; background: var(--stage); border-radius: 10px;
    overflow: hidden; aspect-ratio: 4 / 3; border: 1px solid var(--line);
    display: grid; place-items: center;
  }
  video { width: 100%; height: 100%; object-fit: contain; display: none; }
  video.mirror { transform: scaleX(-1); }
  .placeholder { color: #8fa39a; text-align: center; padding: 24px; max-width: 34ch; line-height: 1.5; }
  .placeholder strong { color: #d5e2db; display: block; margin-bottom: 6px; font-size: 1.05rem; }
  .live {
    position: absolute; top: 10px; left: 10px; display: none; align-items: center; gap: 6px;
    background: rgba(0,0,0,.6); color: #fff; font-size: .8rem; padding: 4px 9px; border-radius: 99px;
  }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: #ff4d4d; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; align-items: center; }
  button, select {
    font: inherit; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:disabled, select:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  select { max-width: 100%; flex: 1 1 200px; }
  label.check { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: .92rem; }
  #status { margin-top: 12px; font-size: .9rem; color: var(--muted); min-height: 1.3em; }
  #status.error { color: #c0392b; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #status.error { color: #ff8a7a; } }
  .snap { margin-top: 16px; display: none; }
  .snap img { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); display: block; }
  .snap a { display: inline-block; margin-top: 8px; color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Camera viewer</h1>
  <p class="sub">See what your device camera sees. Video stays in your browser and is never uploaded.</p>

  <div class="stage">
    <video id="video" autoplay playsinline muted></video>
    <div class="live" id="live"><i></i> Live</div>
    <div class="placeholder" id="placeholder">
      <strong>Camera is off</strong>
      Select Start camera and allow access when your browser asks.
    </div>
  </div>

  <div class="controls">
    <button class="primary" id="toggle">Start camera</button>
    <select id="devices" aria-label="Choose camera" disabled></select>
    <button id="snap" disabled>Take photo</button>
    <label class="check"><input type="checkbox" id="mirror" checked> Mirror</label>
  </div>
  <div id="status" role="status"></div>

  <div class="snap" id="snapBox">
    <img id="snapImg" alt="Captured photo">
    <a id="snapLink" download="photo.png">Save photo</a>
  </div>
</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const video = $('video'), toggle = $('toggle'), devices = $('devices'),
        snap = $('snap'), mirror = $('mirror'), status = $('status'),
        placeholder = $('placeholder'), live = $('live');
  let stream = null;

  function setStatus(msg, isError) {
    status.textContent = msg || '';
    status.className = isError ? 'error' : '';
  }

  async function listDevices() {
    try {
      const all = await navigator.mediaDevices.enumerateDevices();
      const cams = all.filter(d => d.kind === 'videoinput');
      const current = stream && stream.getVideoTracks()[0].getSettings().deviceId;
      devices.innerHTML = '';
      cams.forEach((c, i) => {
        const o = document.createElement('option');
        o.value = c.deviceId;
        o.textContent = c.label || 'Camera ' + (i + 1);
        if (c.deviceId === current) o.selected = true;
        devices.appendChild(o);
      });
      devices.disabled = cams.length < 2;
    } catch (e) { /* ignore */ }
  }

  async function start(deviceId) {
    stop(true);
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('This browser or page does not allow camera access. Open the page over HTTPS in a full browser tab.', true);
      return;
    }
    try {
      setStatus('Requesting camera…');
      stream = await navigator.mediaDevices.getUserMedia({
        video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: 'user' },
        audio: false
      });
      video.srcObject = stream;
      video.style.display = 'block';
      placeholder.style.display = 'none';
      live.style.display = 'flex';
      toggle.textContent = 'Stop camera';
      snap.disabled = false;
      const s = stream.getVideoTracks()[0].getSettings();
      setStatus('Showing ' + (s.width || '?') + '×' + (s.height || '?') + ' video.');
      await listDevices();
    } catch (err) {
      const msgs = {
        NotAllowedError: 'Camera access was blocked. Allow it in your browser’s site settings, then try again.',
        NotFoundError: 'No camera was found on this device.',
        NotReadableError: 'The camera is in use by another app. Close it and try again.',
        OverconstrainedError: 'That camera is not available. Pick another one.'
      };
      setStatus(msgs[err.name] || ('Could not start the camera: ' + err.message), true);
    }
  }

  function stop(keepStatus) {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
    video.srcObject = null;
    video.style.display = 'none';
    placeholder.style.display = '';
    live.style.display = 'none';
    toggle.textContent = 'Start camera';
    snap.disabled = true;
    if (!keepStatus) setStatus('');
  }

  toggle.addEventListener('click', () => stream ? stop() : start());
  devices.addEventListener('change', () => start(devices.value));
  mirror.addEventListener('change', () => video.classList.toggle('mirror', mirror.checked));
  video.classList.toggle('mirror', mirror.checked);

  snap.addEventListener('click', () => {
    if (!video.videoWidth) return;
    const c = document.createElement('canvas');
    c.width = video.videoWidth; c.height = video.videoHeight;
    const ctx = c.getContext('2d');
    if (mirror.checked) { ctx.translate(c.width, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, 0, 0);
    const url = c.toDataURL('image/png');
    $('snapImg').src = url;
    $('snapLink').href = url;
    $('snapBox').style.display = 'block';
  });

  window.addEventListener('pagehide', () => stop(true));
})();
</script>
</body>
</html>
