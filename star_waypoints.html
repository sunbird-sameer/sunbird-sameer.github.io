<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Star Waypoints</title>
<style>
  :root {
    --bg: #0b0d14;
    --panel: #141824;
    --border: #262b3b;
    --text: #e6e8ef;
    --muted: #8891a8;
    --accent: #6ea8fe;
    --accent2: #f5c451;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 14px;
    max-width: 480px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 4px 0 12px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
  }
  label {
    display: block;
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 4px;
    margin-top: 10px;
  }
  label:first-child { margin-top: 0; }
  input {
    width: 100%;
    background: #0e1119;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 0.95rem;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  button {
    width: 100%;
    background: var(--accent);
    color: #0b0d14;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 0.92rem;
    font-weight: 600;
    margin-top: 10px;
    cursor: pointer;
  }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    font-weight: 500;
  }
  .results { margin-top: 12px; }
  .wp-card {
    background: #0e1119;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .wp-title {
    font-size: 0.75rem;
    color: var(--accent2);
    font-weight: 600;
    margin-bottom: 2px;
  }
  .wp-time {
    font-size: 0.72rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .wp-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .stat {
    background: var(--panel);
    border-radius: 6px;
    padding: 6px 8px;
  }
  .stat-label {
    font-size: 0.62rem;
    color: var(--muted);
    text-transform: uppercase;
  }
  .stat-value {
    font-size: 0.98rem;
    font-weight: 600;
  }
  .offset-value { color: var(--accent); }
  .error {
    color: #ff6b6b;
    font-size: 0.8rem;
    margin-top: 8px;
    display: none;
  }
</style>
</head>
<body>

<h1>Star Waypoints</h1>

<div class="panel">
  <label style="margin-top:0">Latitude / Longitude</label>
  <div class="row">
    <div><input type="number" id="lat" step="0.0001" value="40.7128"></div>
    <div><input type="number" id="lon" step="0.0001" value="-74.0060"></div>
  </div>
  <button class="secondary" id="geoBtn" type="button">Use my location</button>

  <label>Start time</label>
  <input type="datetime-local" id="startTime">

  <div class="row">
    <div>
      <label>Start azimuth (deg, from AzAlt app)</label>
      <input type="number" id="startAz" step="1" value="0">
    </div>
    <div>
      <label>Start altitude (deg, from AzAlt app)</label>
      <input type="number" id="startAlt" step="1" value="45">
    </div>
  </div>

  <div class="row">
    <div>
      <label>Duration (hrs)</label>
      <input type="number" id="duration" step="0.1" value="2" min="0.1">
    </div>
    <div>
      <label>Waypoints</label>
      <input type="number" id="numWp" step="1" value="4" min="2" max="20">
    </div>
  </div>

  <button id="calcBtn" type="button">Calculate</button>
  <div class="error" id="errorMsg"></div>
</div>

<div class="results" id="results"></div>

<script>
function toRad(d) { return d * Math.PI / 180; }
function toDeg(r) { return r * 180 / Math.PI; }
function julianDate(date) { return date.getTime() / 86400000 + 2440587.5; }

function gmstDeg(jd) {
  const T = (jd - 2451545.0) / 36525.0;
  let gmst = 280.46061837 + 360.98564736629 * (jd - 2451545.0)
             + 0.000387933 * T * T - (T * T * T) / 38710000.0;
  gmst = gmst % 360;
  if (gmst < 0) gmst += 360;
  return gmst;
}

function raDecToAltAz(raDeg, decDeg, latDeg, lonDeg, date) {
  const jd = julianDate(date);
  const gmst = gmstDeg(jd);
  let lst = ((gmst + lonDeg) % 360 + 360) % 360;
  let ha = lst - raDeg;
  ha = ((ha + 180) % 360 + 360) % 360 - 180;
  const haR = toRad(ha), decR = toRad(decDeg), latR = toRad(latDeg);
  const sinAlt = Math.sin(decR) * Math.sin(latR) + Math.cos(decR) * Math.cos(latR) * Math.cos(haR);
  const alt = Math.asin(Math.max(-1, Math.min(1, sinAlt)));
  const cosAz = (Math.sin(decR) - Math.sin(alt) * Math.sin(latR)) / (Math.cos(alt) * Math.cos(latR));
  let az = toDeg(Math.acos(Math.max(-1, Math.min(1, cosAz))));
  if (Math.sin(haR) > 0) az = 360 - az;
  return { az: az, alt: toDeg(alt) };
}

function altAzToRaDec(azDeg, altDeg, latDeg, lonDeg, date) {
  const jd = julianDate(date);
  const gmst = gmstDeg(jd);
  let lst = ((gmst + lonDeg) % 360 + 360) % 360;
  const azR = toRad(azDeg), altR = toRad(altDeg), latR = toRad(latDeg);
  const sinDec = Math.sin(altR) * Math.sin(latR) + Math.cos(altR) * Math.cos(latR) * Math.cos(azR);
  const dec = Math.asin(Math.max(-1, Math.min(1, sinDec)));
  const cosHa = (Math.sin(altR) - Math.sin(dec) * Math.sin(latR)) / (Math.cos(dec) * Math.cos(latR));
  let ha = toDeg(Math.acos(Math.max(-1, Math.min(1, cosHa))));
  if (Math.sin(azR) >= 0) ha = -ha;
  let ra = ((lst - ha) % 360 + 360) % 360;
  return { ra: ra, dec: toDeg(dec) };
}

function angularSeparation(az1, alt1, az2, alt2) {
  const a1 = toRad(alt1), a2 = toRad(alt2);
  const dAz = toRad(az1 - az2);
  const cosSep = Math.sin(a1) * Math.sin(a2) + Math.cos(a1) * Math.cos(a2) * Math.cos(dAz);
  return toDeg(Math.acos(Math.max(-1, Math.min(1, cosSep))));
}

function generateWaypoints(numWp, startTime, targetRaDec, lat, lon, duration, startAz, startAlt) {
  const totalSeconds = duration * 3600;
  const segmentSeconds = totalSeconds / (numWp - 1);
  const SAMPLE_STEP_SECONDS = 2;
  const GOOD_ENOUGH_THRESHOLD = 0.1; // combined az+alt distance from integer considered "close enough"

  function integralCloseness(pos) {
    return Math.abs(pos.az - Math.round(pos.az)) + Math.abs(pos.alt - Math.round(pos.alt));
  }

  const waypoints = [];
  for (let i = 0; i < numWp; i++) {
    if (i === 0) {
      waypoints.push({ time: startTime, az: startAz, alt: startAlt, score: 0, rounded: false });
      continue;
    }
    const segCenter = startTime.getTime() + i * segmentSeconds * 1000;
    let windowStart, windowEnd;
    if (i === numWp - 1) {
      windowStart = segCenter - (segmentSeconds / 2) * 1000;
      windowEnd = segCenter;
    } else {
      windowStart = segCenter - (segmentSeconds / 2) * 1000;
      windowEnd = segCenter + (segmentSeconds / 2) * 1000;
    }
    let best = null;
    for (let ts = windowStart; ts <= windowEnd; ts += SAMPLE_STEP_SECONDS * 1000) {
      const t = new Date(ts);
      const pos = raDecToAltAz(targetRaDec.ra, targetRaDec.dec, lat, lon, t);
      const score = integralCloseness(pos);
      if (best === null || score < best.score) {
        best = { time: t, az: pos.az, alt: pos.alt, score: score };
      }
    }
    if (best.score > GOOD_ENOUGH_THRESHOLD) {
      // No moment in this window landed close enough to an integer value --
      // fall back to the nominal (segment-center) time and round it instead.
      const nominalT = new Date(segCenter);
      const nominalPos = raDecToAltAz(targetRaDec.ra, targetRaDec.dec, lat, lon, nominalT);
      waypoints.push({ time: nominalT, az: Math.round(nominalPos.az), alt: Math.round(nominalPos.alt), score: 0, rounded: true });
    } else {
      waypoints.push({ time: best.time, az: best.az, alt: best.alt, score: best.score, rounded: false });
    }
  }
  return waypoints;
}

function minConsecutiveSeparation(waypoints) {
  let min = Infinity;
  for (let i = 1; i < waypoints.length; i++) {
    const sep = angularSeparation(waypoints[i-1].az, waypoints[i-1].alt, waypoints[i].az, waypoints[i].alt);
    if (sep < min) min = sep;
  }
  return min;
}

function fmtTime(date) {
  return date.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

document.getElementById('geoBtn').addEventListener('click', function() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(function(pos) {
    document.getElementById('lat').value = pos.coords.latitude.toFixed(4);
    document.getElementById('lon').value = pos.coords.longitude.toFixed(4);
  });
});

(function initTime() {
  const now = new Date();
  now.setSeconds(0, 0);
  const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
  document.getElementById('startTime').value = local.toISOString().slice(0, 16);
})();

document.getElementById('calcBtn').addEventListener('click', function() {
  const errorEl = document.getElementById('errorMsg');
  const resultsEl = document.getElementById('results');
  errorEl.style.display = 'none';
  errorEl.style.color = '';
  resultsEl.innerHTML = '';

  const lat = parseFloat(document.getElementById('lat').value);
  const lon = parseFloat(document.getElementById('lon').value);
  const startAz = parseFloat(document.getElementById('startAz').value);
  const startAlt = parseFloat(document.getElementById('startAlt').value);
  const startStr = document.getElementById('startTime').value;
  const duration = parseFloat(document.getElementById('duration').value);
  const numWp = parseInt(document.getElementById('numWp').value, 10);

  if ([lat, lon, startAz, startAlt, duration, numWp].some(isNaN) || !startStr) {
    errorEl.textContent = 'Fill in all fields with valid numbers.';
    errorEl.style.display = 'block';
    return;
  }
  if (numWp < 2) {
    errorEl.textContent = 'Need at least 2 waypoints.';
    errorEl.style.display = 'block';
    return;
  }
  if (startAlt < -90 || startAlt > 90) {
    errorEl.textContent = 'Altitude must be between -90 and 90.';
    errorEl.style.display = 'block';
    return;
  }

  const startTime = new Date(startStr);
  const targetRaDec = altAzToRaDec(startAz, startAlt, lat, lon, startTime);

  const MIN_SEPARATION_DEG = 4;
  let effectiveNumWp = numWp;
  let waypoints = generateWaypoints(effectiveNumWp, startTime, targetRaDec, lat, lon, duration, startAz, startAlt);

  while (effectiveNumWp > 2 && minConsecutiveSeparation(waypoints) < MIN_SEPARATION_DEG) {
    effectiveNumWp--;
    waypoints = generateWaypoints(effectiveNumWp, startTime, targetRaDec, lat, lon, duration, startAz, startAlt);
  }

  if (effectiveNumWp < numWp) {
    errorEl.textContent = 'Reduced to ' + effectiveNumWp + ' waypoints so consecutive points stay at least ' + MIN_SEPARATION_DEG + '\u00b0 apart.';
    errorEl.style.color = 'var(--muted)';
    errorEl.style.display = 'block';
  }
  if (minConsecutiveSeparation(waypoints) < MIN_SEPARATION_DEG) {
    errorEl.textContent = 'Even at 2 waypoints, the target only moves ' + minConsecutiveSeparation(waypoints).toFixed(2) + '\u00b0 over this duration \u2014 increase the duration for meaningful waypoints.';
    errorEl.style.color = '#ff6b6b';
    errorEl.style.display = 'block';
  }

  const az0 = waypoints[0].az, alt0 = waypoints[0].alt;

  waypoints.forEach(function(wp, i) {
    const panOffset = ((wp.az - az0 + 180) % 360 + 360) % 360 - 180;
    const tiltOffset = wp.alt - alt0;
    const card = document.createElement('div');
    card.className = 'wp-card';
    card.innerHTML =
      '<div class="wp-title">Waypoint ' + i + (i === 0 ? ' (start)' : (i === waypoints.length - 1 ? ' (end)' : '')) + (wp.rounded ? ' \u00b7 rounded' : '') + '</div>' +
      '<div class="wp-time">' + fmtTime(wp.time) + '</div>' +
      '<div class="wp-grid">' +
        '<div class="stat"><div class="stat-label">Az</div><div class="stat-value">' + wp.az.toFixed(3) + '&deg;</div></div>' +
        '<div class="stat"><div class="stat-label">Alt</div><div class="stat-value">' + wp.alt.toFixed(3) + '&deg;</div></div>' +
        '<div class="stat"><div class="stat-label">Pan offset</div><div class="stat-value offset-value">' + (panOffset >= 0 ? '+' : '') + panOffset.toFixed(3) + '&deg;</div></div>' +
        '<div class="stat"><div class="stat-label">Tilt offset</div><div class="stat-value offset-value">' + (tiltOffset >= 0 ? '+' : '') + tiltOffset.toFixed(3) + '&deg;</div></div>' +
      '</div>';
    resultsEl.appendChild(card);
  });

  resultsEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
});
</script>

</body>
</html>
