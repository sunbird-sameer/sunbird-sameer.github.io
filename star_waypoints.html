<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Star Waypoints</title>
<style>
  :root {
    --bg: #0b0d14;
    --panel: #141824;
    --border: #262b3b;
    --text: #e6e8ef;
    --muted: #8891a8;
    --accent: #6ea8fe;
    --accent2: #f5c451;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 14px;
    max-width: 480px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 4px 0 12px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
  }
  label {
    display: block;
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 4px;
    margin-top: 10px;
  }
  label:first-child { margin-top: 0; }
  input {
    width: 100%;
    background: #0e1119;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 0.95rem;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  button {
    width: 100%;
    background: var(--accent);
    color: #0b0d14;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 0.92rem;
    font-weight: 600;
    margin-top: 10px;
    cursor: pointer;
  }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    font-weight: 500;
  }
  .live-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
  }
  .live-stat {
    background: #0e1119;
    border-radius: 8px;
    padding: 10px;
    text-align: center;
  }
  .live-label {
    font-size: 0.65rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .live-value {
    font-size: 1.3rem;
    font-weight: 700;
    margin-top: 2px;
  }
  .live-value-sub {
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--muted);
    margin-top: 2px;
  }
  .status {
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 6px;
    min-height: 1.2em;
  }
  .results { margin-top: 12px; }
  .wp-card {
    background: #0e1119;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .wp-title {
    font-size: 0.75rem;
    color: var(--accent2);
    font-weight: 600;
    margin-bottom: 2px;
  }
  .wp-time {
    font-size: 0.72rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .wp-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .stat {
    background: var(--panel);
    border-radius: 6px;
    padding: 6px 8px;
  }
  .stat-label {
    font-size: 0.62rem;
    color: var(--muted);
    text-transform: uppercase;
  }
  .stat-value {
    font-size: 0.98rem;
    font-weight: 600;
  }
  .offset-value { color: var(--accent); }
  .error {
    color: #ff6b6b;
    font-size: 0.8rem;
    margin-top: 8px;
    display: none;
  }
</style>
</head>
<body>

<h1>Star Waypoints</h1>

<div class="panel">
  <button class="secondary" id="meterBtn" type="button">Start live Az/Alt meter</button>
  <div class="live-grid" id="meterDisplay" style="display:none">
    <div class="live-stat">
      <div class="live-label">Azimuth (corrected)</div>
      <div class="live-value" id="liveAz">--</div>
      <div class="live-value-sub" id="liveAzRaw">predicted: --</div>
    </div>
    <div class="live-stat">
      <div class="live-label">Altitude</div>
      <div class="live-value" id="liveAlt">--</div>
    </div>
  </div>
  <button id="useReadingBtn" type="button" style="display:none">Use as starting Az/Alt</button>
  <div class="status" id="meterStatus"></div>
</div>

<div class="panel">
  <label style="margin-top:0">Latitude / Longitude</label>
  <div class="row">
    <div><input type="number" id="lat" step="0.0001" value="40.7128"></div>
    <div><input type="number" id="lon" step="0.0001" value="-74.0060"></div>
  </div>
  <button class="secondary" id="geoBtn" type="button">Use my location</button>

  <label>Start time</label>
  <input type="datetime-local" id="startTime">

  <div class="row">
    <div>
      <label>Start azimuth (deg)</label>
      <input type="number" id="startAz" step="1" value="0">
    </div>
    <div>
      <label>Start altitude (deg)</label>
      <input type="number" id="startAlt" step="1" value="45">
    </div>
  </div>

  <div class="row">
    <div>
      <label>Duration (hrs)</label>
      <input type="number" id="duration" step="0.1" value="2" min="0.1">
    </div>
    <div>
      <label>Waypoints</label>
      <input type="number" id="numWp" step="1" value="4" min="2" max="20">
    </div>
  </div>

  <button id="calcBtn" type="button">Calculate</button>
  <div class="error" id="errorMsg"></div>
</div>

<div class="results" id="results"></div>

<script>
let latestHeading = null;
let latestAlt = null;
let meterActive = false;
let refBeta = null; // beta value at meter start, treated as the horizon (altitude 0) reference

// Proper tilt-compensated compass heading (W3C reference algorithm).
// Combines alpha/beta/gamma together instead of just using alpha, so the
// azimuth reading stays correct as you tilt through different altitudes
// instead of drifting with tilt.
function computeTiltCompensatedHeading(alpha, beta, gamma) {
  const d2r = Math.PI / 180;
  const x = beta ? beta * d2r : 0;
  const y = gamma ? gamma * d2r : 0;
  const z = alpha ? alpha * d2r : 0;

  const cX = Math.cos(x), cY = Math.cos(y), cZ = Math.cos(z);
  const sX = Math.sin(x), sY = Math.sin(y), sZ = Math.sin(z);

  const Vx = -cZ * sY - sZ * sX * cY;
  const Vy = -sZ * sY + cZ * sX * cY;

  // When the phone is (near) perfectly flat, Vx and Vy both collapse toward
  // zero and atan(Vx/Vy) becomes NaN -- fall back to the simple flat-phone
  // heading in that case.
  if (Math.abs(Vx) < 1e-9 && Math.abs(Vy) < 1e-9) {
    return ((360 - alpha) % 360 + 360) % 360;
  }

  let heading = Math.atan(Vx / Vy);
  if (Vy < 0) {
    heading += Math.PI;
  } else if (Vx < 0) {
    heading += 2 * Math.PI;
  }
  return heading * (180 / Math.PI);
}

// Smooths jitter and rejects sudden implausible jumps (usually caused by
// the alpha/beta/gamma representation briefly flipping branches when the
// phone rolls sideways). Works on the unit circle so it handles 359->1 deg
// wraparound correctly, unlike averaging raw degree values.
let smoothedVec = null;       // {x, y} unit vector representing smoothed heading
let pendingJump = null;       // {heading, count} - candidate for a real (not glitch) big move
const SMOOTHING = 0.25;       // 0 = no smoothing/instant, 1 = frozen
const JUMP_THRESHOLD_DEG = 60;
const JUMP_CONFIRM_FRAMES = 3;

function smoothHeading(rawHeadingDeg) {
  const rad = rawHeadingDeg * Math.PI / 180;
  const vec = { x: Math.cos(rad), y: Math.sin(rad) };

  if (smoothedVec === null) {
    smoothedVec = vec;
    return rawHeadingDeg;
  }

  const currentDeg = Math.atan2(smoothedVec.y, smoothedVec.x) * 180 / Math.PI;
  let diff = rawHeadingDeg - currentDeg;
  diff = ((diff + 180) % 360 + 360) % 360 - 180; // shortest angular distance

  if (Math.abs(diff) > JUMP_THRESHOLD_DEG) {
    // Could be a real fast move, or a branch-flip glitch. Only accept it
    // once the same large jump shows up on consecutive frames.
    if (pendingJump && Math.abs(((rawHeadingDeg - pendingJump.heading + 180) % 360 + 360) % 360 - 180) < 15) {
      pendingJump.count++;
    } else {
      pendingJump = { heading: rawHeadingDeg, count: 1 };
    }
    if (pendingJump.count < JUMP_CONFIRM_FRAMES) {
      // Ignore this sample, keep showing the last stable smoothed heading.
      return ((currentDeg % 360) + 360) % 360;
    }
    // Confirmed real move -- snap to it directly instead of slow-blending.
    smoothedVec = vec;
    pendingJump = null;
    return rawHeadingDeg;
  }

  pendingJump = null;
  smoothedVec = {
    x: smoothedVec.x * SMOOTHING + vec.x * (1 - SMOOTHING),
    y: smoothedVec.y * SMOOTHING + vec.y * (1 - SMOOTHING)
  };
  const smoothedDeg = Math.atan2(smoothedVec.y, smoothedVec.x) * 180 / Math.PI;
  return ((smoothedDeg % 360) + 360) % 360;
}

function handleOrientation(event) {
  let corrected = null;
  let predicted = null;

  if (typeof event.alpha === 'number') {
    predicted = ((360 - event.alpha) % 360 + 360) % 360;
  }

  if (typeof event.webkitCompassHeading === 'number') {
    // iOS already gives a tilt-compensated true heading directly.
    corrected = event.webkitCompassHeading;
  } else if (typeof event.alpha === 'number' && typeof event.beta === 'number' && typeof event.gamma === 'number') {
    corrected = computeTiltCompensatedHeading(event.alpha, event.beta, event.gamma);
  }

  if (corrected !== null) {
    const smoothed = smoothHeading(corrected);
    latestHeading = smoothed;
    document.getElementById('liveAz').textContent = latestHeading.toFixed(1) + '\u00b0';
  }
  if (predicted !== null) {
    document.getElementById('liveAzRaw').textContent = 'predicted: ' + predicted.toFixed(1) + '\u00b0';
  }
  if (typeof event.beta === 'number') {
    if (refBeta === null) {
      // First reading after starting the meter: assume the phone was held
      // vertically pointing at the horizon at this moment, and treat this
      // beta as the altitude-0 reference. All later readings are relative
      // to it, so absolute mounting angle/orientation doesn't matter.
      refBeta = event.beta;
    }
    latestAlt = event.beta - refBeta;
    document.getElementById('liveAlt').textContent = latestAlt.toFixed(1) + '\u00b0';
  }
}

document.getElementById('meterBtn').addEventListener('click', function() {
  const statusEl = document.getElementById('meterStatus');

  if (meterActive) {
    window.removeEventListener('deviceorientationabsolute', handleOrientation, true);
    window.removeEventListener('deviceorientation', handleOrientation, true);
    meterActive = false;
    document.getElementById('meterDisplay').style.display = 'none';
    document.getElementById('useReadingBtn').style.display = 'none';
    document.getElementById('meterBtn').textContent = 'Start live Az/Alt meter';
    statusEl.textContent = '';
    return;
  }

  function startListening() {
    smoothedVec = null;
    pendingJump = null;
    refBeta = null;
    window.addEventListener('deviceorientationabsolute', handleOrientation, true);
    window.addEventListener('deviceorientation', handleOrientation, true);
    meterActive = true;
    document.getElementById('meterDisplay').style.display = 'grid';
    document.getElementById('useReadingBtn').style.display = 'block';
    document.getElementById('meterBtn').textContent = 'Stop meter';
    statusEl.textContent = 'Hold phone vertical, pointed at horizon, then keep still for a moment.';
  }

  if (!window.DeviceOrientationEvent) {
    statusEl.textContent = 'Not supported on this device/browser.';
    return;
  }
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(function(r) {
      if (r === 'granted') startListening();
      else statusEl.textContent = 'Permission denied.';
    }).catch(function(e) { statusEl.textContent = e.message; });
  } else {
    startListening();
  }
});

document.getElementById('useReadingBtn').addEventListener('click', function() {
  const statusEl = document.getElementById('meterStatus');
  if (latestHeading === null || latestAlt === null) {
    statusEl.textContent = 'No reading yet.';
    return;
  }
  document.getElementById('startAz').value = Math.round(latestHeading);
  document.getElementById('startAlt').value = Math.round(latestAlt);
  const now = new Date();
  now.setSeconds(0, 0);
  const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
  document.getElementById('startTime').value = local.toISOString().slice(0, 16);
  statusEl.textContent = 'Applied to fields below.';
  document.getElementById('startAz').scrollIntoView({ behavior: 'smooth', block: 'center' });
});

function toRad(d) { return d * Math.PI / 180; }
function toDeg(r) { return r * 180 / Math.PI; }
function julianDate(date) { return date.getTime() / 86400000 + 2440587.5; }

function gmstDeg(jd) {
  const T = (jd - 2451545.0) / 36525.0;
  let gmst = 280.46061837 + 360.98564736629 * (jd - 2451545.0)
             + 0.000387933 * T * T - (T * T * T) / 38710000.0;
  gmst = gmst % 360;
  if (gmst < 0) gmst += 360;
  return gmst;
}

function raDecToAltAz(raDeg, decDeg, latDeg, lonDeg, date) {
  const jd = julianDate(date);
  const gmst = gmstDeg(jd);
  let lst = ((gmst + lonDeg) % 360 + 360) % 360;
  let ha = lst - raDeg;
  ha = ((ha + 180) % 360 + 360) % 360 - 180;
  const haR = toRad(ha), decR = toRad(decDeg), latR = toRad(latDeg);
  const sinAlt = Math.sin(decR) * Math.sin(latR) + Math.cos(decR) * Math.cos(latR) * Math.cos(haR);
  const alt = Math.asin(Math.max(-1, Math.min(1, sinAlt)));
  const cosAz = (Math.sin(decR) - Math.sin(alt) * Math.sin(latR)) / (Math.cos(alt) * Math.cos(latR));
  let az = toDeg(Math.acos(Math.max(-1, Math.min(1, cosAz))));
  if (Math.sin(haR) > 0) az = 360 - az;
  return { az: az, alt: toDeg(alt) };
}

function altAzToRaDec(azDeg, altDeg, latDeg, lonDeg, date) {
  const jd = julianDate(date);
  const gmst = gmstDeg(jd);
  let lst = ((gmst + lonDeg) % 360 + 360) % 360;
  const azR = toRad(azDeg), altR = toRad(altDeg), latR = toRad(latDeg);
  const sinDec = Math.sin(altR) * Math.sin(latR) + Math.cos(altR) * Math.cos(latR) * Math.cos(azR);
  const dec = Math.asin(Math.max(-1, Math.min(1, sinDec)));
  const cosHa = (Math.sin(altR) - Math.sin(dec) * Math.sin(latR)) / (Math.cos(dec) * Math.cos(latR));
  let ha = toDeg(Math.acos(Math.max(-1, Math.min(1, cosHa))));
  if (Math.sin(azR) >= 0) ha = -ha;
  let ra = ((lst - ha) % 360 + 360) % 360;
  return { ra: ra, dec: toDeg(dec) };
}

function fmtTime(date) {
  return date.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

document.getElementById('geoBtn').addEventListener('click', function() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(function(pos) {
    document.getElementById('lat').value = pos.coords.latitude.toFixed(4);
    document.getElementById('lon').value = pos.coords.longitude.toFixed(4);
  });
});

(function initTime() {
  const now = new Date();
  now.setSeconds(0, 0);
  const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
  document.getElementById('startTime').value = local.toISOString().slice(0, 16);
})();

document.getElementById('calcBtn').addEventListener('click', function() {
  const errorEl = document.getElementById('errorMsg');
  const resultsEl = document.getElementById('results');
  errorEl.style.display = 'none';
  resultsEl.innerHTML = '';

  const lat = parseFloat(document.getElementById('lat').value);
  const lon = parseFloat(document.getElementById('lon').value);
  const startAz = parseFloat(document.getElementById('startAz').value);
  const startAlt = parseFloat(document.getElementById('startAlt').value);
  const startStr = document.getElementById('startTime').value;
  const duration = parseFloat(document.getElementById('duration').value);
  const numWp = parseInt(document.getElementById('numWp').value, 10);

  if ([lat, lon, startAz, startAlt, duration, numWp].some(isNaN) || !startStr) {
    errorEl.textContent = 'Fill in all fields with valid numbers.';
    errorEl.style.display = 'block';
    return;
  }
  if (numWp < 2) {
    errorEl.textContent = 'Need at least 2 waypoints.';
    errorEl.style.display = 'block';
    return;
  }
  if (startAlt < -90 || startAlt > 90) {
    errorEl.textContent = 'Altitude must be between -90 and 90.';
    errorEl.style.display = 'block';
    return;
  }

  const startTime = new Date(startStr);
  const targetRaDec = altAzToRaDec(startAz, startAlt, lat, lon, startTime);

  const waypoints = [];
  for (let i = 0; i < numWp; i++) {
    const hoursOffset = (duration * i) / (numWp - 1);
    const t = new Date(startTime.getTime() + hoursOffset * 3600000);
    const pos = raDecToAltAz(targetRaDec.ra, targetRaDec.dec, lat, lon, t);
    waypoints.push({ time: t, az: pos.az, alt: pos.alt });
  }

  const az0 = waypoints[0].az, alt0 = waypoints[0].alt;

  waypoints.forEach(function(wp, i) {
    const panOffset = ((wp.az - az0 + 180) % 360 + 360) % 360 - 180;
    const tiltOffset = wp.alt - alt0;
    const card = document.createElement('div');
    card.className = 'wp-card';
    card.innerHTML =
      '<div class="wp-title">Waypoint ' + i + (i === 0 ? ' (start)' : (i === waypoints.length - 1 ? ' (end)' : '')) + '</div>' +
      '<div class="wp-time">' + fmtTime(wp.time) + '</div>' +
      '<div class="wp-grid">' +
        '<div class="stat"><div class="stat-label">Az</div><div class="stat-value">' + wp.az.toFixed(2) + '&deg;</div></div>' +
        '<div class="stat"><div class="stat-label">Alt</div><div class="stat-value">' + wp.alt.toFixed(2) + '&deg;</div></div>' +
        '<div class="stat"><div class="stat-label">Pan offset</div><div class="stat-value offset-value">' + (panOffset >= 0 ? '+' : '') + panOffset.toFixed(2) + '&deg;</div></div>' +
        '<div class="stat"><div class="stat-label">Tilt offset</div><div class="stat-value offset-value">' + (tiltOffset >= 0 ? '+' : '') + tiltOffset.toFixed(2) + '&deg;</div></div>' +
      '</div>';
    resultsEl.appendChild(card);
  });

  resultsEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
});
</script>

</body>
</html>
