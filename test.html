<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nokia 3210 Speech to Text</title>
    <style>
        body { 
            font-family: sans-serif; 
            padding: 15px; 
            text-align: center; 
            background: #fff; 
            color: #000; 
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        button { 
            padding: 12px; 
            width: 90%; 
            margin: 8px 0; 
            font-weight: bold; 
            font-size: 14px; 
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:disabled {
            background-color: #ccc;
        }
        #status { 
            color: #555; 
            margin: 10px 0; 
            font-weight: bold; 
            font-style: italic;
        }
        #output { 
            margin-top: 15px; 
            padding: 12px; 
            background: #f9f9f9; 
            border: 1px solid #ddd; 
            border-radius: 4px;
            min-height: 60px; 
            text-align: left; 
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <div class="container">
        <h3>Groq Cloud Speech to Text</h3>
        
        <div id="status">Status: Ready to record!</div>
        
        <button id="action-btn">Press & Speak (4 Seconds)</button>
        
        <h4>Transcription Result:</h4>
        <div id="output">Your text will appear here...</div>
    </div>

    <script>
        // HARDCODE YOUR API KEY HERE FOR TESTING
        const API_KEY = "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"; 

        const actionBtn = document.getElementById('action-btn');
        const statusDiv = document.getElementById('status');
        const outputDiv = document.getElementById('output');
        
        let mediaRecorder;
        let audioChunks = [];

        actionBtn.addEventListener('click', async () => {
            try {
                audioChunks = [];
                // Request microphone stream
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                
                mediaRecorder.onstop = async () => {
                    // Turn off phone hardware right after recording stops
                    stream.getTracks().forEach(track => track.stop());
                    
                    statusDiv.textContent = "Status: Processing audio...";
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    
                    // Route to Groq API
                    await sendToTranscriptionAPI(audioBlob);
                };

                // Record a fixed 4-second snippet
                mediaRecorder.start();
                statusDiv.textContent = "Status: Listening... Speak now.";
                actionBtn.disabled = true;
                
                setTimeout(() => {
                    mediaRecorder.stop();
                    actionBtn.disabled = false;
                }, 4000);

            } catch (err) {
                statusDiv.textContent = "Status: Mic Access Error";
                outputDiv.textContent = "Could not open microphone: " + err.message;
            }
        });

        async function sendToTranscriptionAPI(audioBlob) {
            const formData = new FormData();
            formData.append('file', audioBlob, 'audio.wav');
            formData.append('model', 'whisper-large-v3-turbo');
            formData.append('language', 'en'); 

            const API_URL = "https://api.groq.com/openai/v1/audio/transcriptions";

            try {
                statusDiv.textContent = "Status: Sending to Groq LPU Cloud...";
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: formData
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || `Error ${response.status}`);
                }
                
                const data = await response.json();
                outputDiv.textContent = data.text || "Audio received, but no text recognized.";
                statusDiv.textContent = "Status: Success!";

            } catch (error) {
                statusDiv.textContent = "Status: Groq API Error";
                outputDiv.textContent = error.message;
                console.error(error);
            }
        }
    </script>
</body>
</html>
