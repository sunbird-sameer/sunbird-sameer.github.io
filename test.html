<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nokia Mic Hardware Test</title>
    <style>
        body { font-family: sans-serif; padding: 15px; text-align: center; background: #fff; color: #000; }
        button { padding: 10px; width: 80%; margin: 5px 0; font-weight: bold; }
        #status { color: red; margin: 10px 0; font-weight: bold; }
    </style>
</head>
<body>

    <h3>Nokia 3210 Mic Hardware Test</h3>
    <div id="status">Status: Click Record to prompt mic</div>
    
    <button id="rec-btn">1. Start Recording</button>
    <button id="stop-btn" disabled>2. Stop</button>
    
    <br><br>
    <audio id="audio-playback" controls></audio>

    <script>
        const recBtn = document.getElementById('rec-btn');
        const stopBtn = document.getElementById('stop-btn');
        const statusDiv = document.getElementById('status');
        const playback = document.getElementById('audio-playback');
        
        let mediaRecorder;
        let audioChunks = [];

        recBtn.addEventListener('click', async () => {
            statusDiv.textContent = "Status: Requesting Mic...";
            audioChunks = [];
            
            try {
                // Testing basic hardware access
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                statusDiv.textContent = "Status: Recording... Speak!";
                statusDiv.style.color = "green";
                
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    playback.src = URL.createObjectURL(audioBlob);
                    statusDiv.textContent = "Status: Done. Try playing audio below.";
                    statusDiv.style.color = "blue";
                };
                
                mediaRecorder.start();
                recBtn.disabled = true;
                stopBtn.disabled = false;
                
            } catch (err) {
                statusDiv.textContent = "Status: Blocked (" + err.name + ")";
                statusDiv.style.color = "red";
                alert("Mic Access Failed: " + err.message);
            }
        });

        stopBtn.addEventListener('click', () => {
            if(mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
                // Stop tracks to release mic
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                recBtn.disabled = false;
                stopBtn.disabled = true;
            }
        });
    </script>
</body>
</html>
